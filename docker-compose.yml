name: pathigo

services:
  database:
    image: postgres:latest
    container_name: pathigo-database-container
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_URL}
    ports:
      - '${DATABASE_PORT}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME} -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure