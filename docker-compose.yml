name: pathigo

services:
  database:
    image: postgres:latest
    container_name: pathigo-database-container
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DB}
    ports:
      - '${DATABASE_PORT}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DB} -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure