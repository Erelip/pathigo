server:
  port: 8081

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/pathigo}
    username: ${DATABASE_USERNAME:pathigo}
    password: ${DATABASE_PASSWORD:pathigo}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        database: postgresql
        ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: ${GOOGLE_SCOPE:openid,profile,email}

security:
  jwt:
    secret-key: ${JWT_SECRET:S1fLwkGQkjDdPiAcKXSJPv/UF1kU//gQGo9TJbEj3E647D4xIOxcbuswdxtsJpp8bsHCzYdbPvF+amiuOy5z0w==}
    access:
      expiration-ms: ${ACCESS_EXPIRATION:3600000}
    refresh:
      expiration-ms: ${REFRESH_EXPIRATION:3600000}

app:
  frontend:
    url: ${REFRESH_EXPIRATION:http://localhost:4000/home}
  auth:
    cookie-secure: false
    cookie-same-site: None
